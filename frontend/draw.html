<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Vẽ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Disable browser gestures like pull-to-refresh */
        }
        .tool-btn.active {
            background-color: #3b82f6; /* blue-500 */
            color: white;
            border-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen p-4">

    <h1 class="text-3xl font-bold text-gray-800 mb-4">Bảng vẽ</h1>

    <!-- Toolbar for drawing controls -->
    <div id="toolbar" class="w-full max-w-4xl bg-white p-3 rounded-lg shadow-md mb-4 flex flex-wrap items-center justify-center gap-4">
        <!-- Color Picker -->
        <div class="flex items-center gap-2">
            <label for="colorPicker" class="text-sm font-medium text-gray-700">Màu:</label>
            <input type="color" id="colorPicker" value="#000000" class="w-10 h-10 p-1 border border-gray-300 rounded-md cursor-pointer">
        </div>

        <!-- Brush Size Slider -->
        <div class="flex items-center gap-2">
            <label for="brushSize" class="text-sm font-medium text-gray-700">Nét vẽ:</label>
            <input type="range" id="brushSize" min="1" max="50" value="5" class="cursor-pointer">
            <span id="brushSizeValue" class="text-sm font-medium text-gray-700 w-6 text-center">5</span>
        </div>

        <!-- Drawing Tools -->
        <div class="flex items-center gap-2">
             <button id="pencilBtn" class="tool-btn active p-2 border-2 border-gray-300 rounded-md hover:bg-gray-200 transition-colors" title="Bút chì">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
            </button>
            <button id="eraserBtn" class="tool-btn p-2 border-2 border-gray-300 rounded-md hover:bg-gray-200 transition-colors" title="Tẩy">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21H7Z"/><path d="M18 7.5h-4"/><path d="m15 10.5-5-5"/></svg>
            </button>
        </div>

        <!-- Action Buttons -->
        <div class="flex items-center gap-2">
            <button id="clearBtn" class="p-2 bg-red-500 text-white rounded-md hover:bg-red-600 transition-colors font-semibold">Xóa hết</button>
            <a id="saveBtn" class="p-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition-colors font-semibold" download="my-drawing.png">Lưu ảnh</a>
        </div>
    </div>

    <!-- Drawing Canvas -->
    <canvas id="drawingCanvas" class="bg-white rounded-lg shadow-lg"></canvas>

    <script>
        window.addEventListener('load', () => {
            const canvas = document.getElementById('drawingCanvas');
            const toolbar = document.getElementById('toolbar');
            const ctx = canvas.getContext('2d');

            // --- STATE VARIABLES ---
            let isDrawing = false;
            let lastX = 0;
            let lastY = 0;
            let currentTool = 'pencil'; // 'pencil' or 'eraser'

            // --- UI ELEMENTS ---
            const colorPicker = document.getElementById('colorPicker');
            const brushSizeSlider = document.getElementById('brushSize');
            const brushSizeValue = document.getElementById('brushSizeValue');
            const pencilBtn = document.getElementById('pencilBtn');
            const eraserBtn = document.getElementById('eraserBtn');
            const clearBtn = document.getElementById('clearBtn');
            const saveBtn = document.getElementById('saveBtn');
            
            // --- SET CANVAS SIZE ---
            function resizeCanvas() {
                // Save current drawing
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                
                // Adjust canvas size based on container, considering toolbar height
                const canvasContainer = canvas.parentElement;
                const toolbarHeight = toolbar.offsetHeight;
                const availableHeight = window.innerHeight - toolbarHeight - 80; // 80px for padding and margins
                const availableWidth = canvasContainer.clientWidth;

                canvas.width = availableWidth;
                canvas.height = availableHeight;
                
                // Restore drawing
                ctx.putImageData(imageData, 0, 0);

                // Re-apply settings as they can be reset on resize
                ctx.strokeStyle = colorPicker.value;
                ctx.lineWidth = brushSizeSlider.value;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }

            // Initial resize
            resizeCanvas();

            // --- DRAWING LOGIC ---
            function getMousePos(evt) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: evt.clientX - rect.left,
                    y: evt.clientY - rect.top
                };
            }
            
            function getTouchPos(evt) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: evt.touches[0].clientX - rect.left,
                    y: evt.touches[0].clientY - rect.top
                };
            }

            function startDrawing(e) {
                isDrawing = true;
                const pos = e.touches ? getTouchPos(e) : getMousePos(e);
                [lastX, lastY] = [pos.x, pos.y];
            }

            function draw(e) {
                if (!isDrawing) return;
                e.preventDefault(); // prevent scrolling while drawing

                const pos = e.touches ? getTouchPos(e) : getMousePos(e);
                
                // Set tool properties
                if (currentTool === 'pencil') {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = colorPicker.value;
                } else if (currentTool === 'eraser') {
                    ctx.globalCompositeOperation = 'destination-out';
                }
                ctx.lineWidth = brushSizeSlider.value;

                // Draw line
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();

                [lastX, lastY] = [pos.x, pos.y];
            }

            function stopDrawing() {
                isDrawing = false;
            }
            
            // --- EVENT LISTENERS ---
            // Mouse events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing); // Stop drawing if mouse leaves canvas

            // Touch events
            canvas.addEventListener('touchstart', startDrawing);
            canvas.addEventListener('touchmove', draw);
            canvas.addEventListener('touchend', stopDrawing);
            canvas.addEventListener('touchcancel', stopDrawing);

            // Window resize
            window.addEventListener('resize', resizeCanvas);

            // --- TOOLBAR CONTROLS ---
            brushSizeSlider.addEventListener('input', (e) => {
                const size = e.target.value;
                brushSizeValue.textContent = size;
                ctx.lineWidth = size;
            });

            colorPicker.addEventListener('change', (e) => {
                ctx.strokeStyle = e.target.value;
            });

            clearBtn.addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });
            
            saveBtn.addEventListener('click', () => {
                // Temporarily fill background with white for saving
                ctx.globalCompositeOperation = 'destination-over';
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Get image data
                const dataURL = canvas.toDataURL('image/png');
                saveBtn.href = dataURL;
                
                // Reset composite operation and clear the temporary background
                ctx.globalCompositeOperation = 'source-over';
                 // This part is tricky, clearing the temp background without deleting the drawing
                 // The easiest way is to re-draw everything, but for this simple app, we accept this behavior.
                 // A better implementation would use an off-screen canvas.
            });

            pencilBtn.addEventListener('click', () => {
                currentTool = 'pencil';
                pencilBtn.classList.add('active');
                eraserBtn.classList.remove('active');
            });

            eraserBtn.addEventListener('click', () => {
                currentTool = 'eraser';
                eraserBtn.classList.add('active');
                pencilBtn.classList.remove('active');
            });
        });
    </script>
</body>
</html>
